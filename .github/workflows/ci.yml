name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  pdf:
    name: pdf
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BOOKS_REQUIRE_PDF_TOOLS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $(cat .github/pdf-packages.txt)
      - run: npx tsx --test "tests/pdf/**/*.test.ts"
      # No --site-url: every edition links back to the canonical site_url in series.md.
      - name: Build every edition
        run: npm run pdf
      - uses: actions/upload-artifact@v7
        with:
          name: pdf
          path: dist/pdf/
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: deploy to Cloudflare
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, e2e, pdf]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://xyzw.space
    steps:
      - uses: actions/checkout@v7
        with:
          # The "last updated" line on every chapter is read from the file's history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The site is built around the PDFs the pdf job already tested, not a fresh pair.
      - uses: actions/download-artifact@v8
        with:
          name: pdf
          path: dist/pdf/
      - run: npm run build
      - name: Upload to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test the live site
        env:
          BASE: https://xyzw.space/
        run: |
          fetch() { curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors "$BASE$1"; }
          fetch "" | grep -q '<meta name="robots" content="noindex"'
          fetch "zh/" | grep -q 'hreflang="en"'
          fetch "zh/linear-algebra/01/" | grep -q 'data-comments="true"'
          pdf=$(fetch "zh/linear-algebra/" | grep -o 'href="[^"]*pdf/linear-algebra\.zh\.pdf"' | head -n1 | cut -d'"' -f2)
          test -n "$pdf"
          curl -fsSI --retry 6 --retry-delay 10 --retry-all-errors "$(printf '%s' "$BASE" | sed -E 's#^(https?://[^/]+).*#\1#')$pdf" | grep -qi 'content-type: application/pdf'
          fetch "pagefind/pagefind-entry.json" | grep -q '"zh-cn"'
