name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DEPLOYING: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  pdf:
    name: pdf
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      BOOKS_REQUIRE_PDF_TOOLS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $(cat .github/pdf-packages.txt)
      - run: npx tsx --test "tests/pdf/**/*.test.ts"
      - id: pages
        if: env.DEPLOYING == 'true'
        uses: actions/configure-pages@v6
      - name: Build every edition
        run: npm run pdf -- ${SITE_URL:+--site-url "$SITE_URL"}
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-artifact@v7
        with:
          name: pdf
          path: dist/pdf/
          include-hidden-files: true
          retention-days: 7

  pages:
    name: build the Pages site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, e2e, pdf]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v6
      - uses: actions/download-artifact@v8
        with:
          name: pdf
          path: dist/pdf/
      - run: npm run build -- --site-url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: deploy to GitHub Pages
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke-test the live site
        env:
          BASE: ${{ steps.deployment.outputs.page_url }}
        run: |
          fetch() { curl -fsSL --retry 6 --retry-delay 10 --retry-all-errors "$BASE$1"; }
          fetch "" | grep -q '<meta name="robots" content="noindex"'
          fetch "zh/" | grep -q 'hreflang="en"'
          pdf=$(fetch "zh/linear-algebra/" | grep -o 'href="[^"]*pdf/linear-algebra\.zh\.pdf"' | head -n1 | cut -d'"' -f2)
          test -n "$pdf"
          curl -fsSI --retry 6 --retry-delay 10 --retry-all-errors "$(printf '%s' "$BASE" | sed -E 's#^(https?://[^/]+).*#\1#')$pdf" | grep -qi 'content-type: application/pdf'
          fetch "pagefind/pagefind-entry.json" | grep -q '"zh-cn"'
